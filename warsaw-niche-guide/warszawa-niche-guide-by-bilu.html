howskiego i Danuty Bredy-Brzuchowskiej jako pierwsze w Warszawie kryte lodowisko. Industrialno-inżynieryjna ciekawostka: w drugiej połowie lat 60. dobudowano wspornikowo wysunięte zadaszenie, stosując po raz pierwszy w Polsce kablobeton (sprężony); w 2025 r. hala przeszła remont z wymianą dachu. Dziś to główna warszawska arena gal sportów walki — odbywają się tu gale boksu (Warsaw Boxing Night), KSW, MMA i K-1, oglądane przez tysiące widzów (do ok. 4800 miejsc). Idealne miejsce, by realnie obejrzeć galę boksu/MMA, a nie tylko trenować. Bilety zależne od wydarzenia. Dojazd: tramwaje i autobusy w rejonie Rozbrat/Łazienkowska i Wybrzeże Kościuszkowskie, blisko centrum.","sources":[{"tier":"A","url":"https://torwar.cos.pl/3318/warsaw-boxing-night","for":"oficjalna strona COS, gale boksu, funkcja obiektu"},{"tier":"A","url":"https://torwar.cos.pl/5076/cos-torwar-ma-nowy-dach","for":"oficjalna strona COS, remont i nowy dach 2025, czynność obiektu"},{"tier":"B","url":"https://pl.wikipedia.org/wiki/Hala_Torwar","for":"adres Łazienkowska 6a, dzielnica Śródmieście, historia 1953–57, kablobeton, projektanci"}],"qc_flags":["MISSING"],"confidence":"high","origin":"agent"},{"n":"Uniq Fight Club","ct":"hazard","la":52.217,"lo":21.1633,"rt":4.8,"rt_week":4.8,"rt_weekend":4.8,"rv":412,"ad":"ul. VI Poprzeczna 23","district":"Wawer","st":"Warszawa Anin (SKM/KM)","lines":["SKM","KM","BUS"],"hr_week":"Pon i śr 07:00–23:00; wt i czw 07:00–22:00; pt 07:00–21:00","hr_weekend":"Sob 09:00–15:00; niedz 10:00–14:00","img":null,"wiki":null,"ds":"Niszowy, lokalny klub sportów walki urządzony we wnętrzu dawnego kina na Aninie (Wawer), prowadzony z pasją przez braci Kamila i Radka Paczuskich. Około 400 m² przystosowane do treningu: profesjonalny ring, elementy klatki MMA i maty tatami, plus strefa cross-fit/przygotowania motorycznego. W ofercie boks, kickboxing, krav maga, MMA i karate dla dzieci. To off-the-beaten-track miejsce o rzemieślniczym, klubowym charakterze — surowa, industrialna przestr i":"Pałac Kultury i Nauki","ds":"Najwyższy i najbardziej rozpoznawalny gmach socrealizmu w Polsce, ukończony w 1955 r. jako 'dar' Stalina, proj. Lew Rudniew na wzór moskiewskich 'siedmiu sióstr', z elementami polskiego renesansu. Zamiast oblegania holu warto wjechać windą (19 s) na taras na 30. piętrze (114 m) i przyjrzeć się socrealistycznym rzeźbom w niszach fasady oraz Sali Gotyckiej z gwiaździstym sklepieniem. Bilet ok. 25 zł (ulgowy 20 zł); dojazd metrem do stacji Centrum tuż obok.","sources":[{"tier":"A","url":"https://pkin.pl/en/viewing-terrace/","for":"godziny tarasu, ceny biletów, oficjalna strona obiektu"},{"tier":"B","url":"https://en.wikipedia.org/wiki/Palace_of_Culture_and_Science","for":"historia, architekt, styl socrealistyczny, dane budynku"},{"tier":"C","url":"https://www.dark-tourism.com/index.php/1174-palac-kultury","for":"kontekst 'dark history' / dziedzictwo PRL"}],"qc_flags":["MISSING_RATING","TOURISTY","MISSING"],"confidence":"high","origin":"agent"},{"n":"ZODIAK Warszawski Pawilon Architektury","ct":"architecture","la":52.2308,"lo":21.0119,"rt":null,"rt_week":null,"rt_weekend":null,"rv":null,"ad":"Pasaż Stefana Wiecheckiego \"Wiecha\" 4","district":"Śródmieście","st":"Centrum","lines":["M1","M2","TRAM","BUS"],"hr_week":"wt-pt 15:00-19:00 (zamknięte pon)","hr_weekend":"sob-niedz 12:00-19:00","img":null,"wiki":null,"ds":"Pawilon Zodiak to ikona warszawskiego modernizmu powojennego (proj. Jan Bogusławski i Bohdan Gniewiewski, 1968), element słynnej Ściany Wschodniej. Po latach dewastacji odrestaurowany (Kalata Architekci) i otwarty w 2018 r. jako Warszawski Pawilon Architektury prowadzony przez oddział SARP - miejsce wystaw, debat i spacerów o architekturze stolicy. Wstęp bezpłatny, lokalizacja w pasażu Wiecha tuż przy Rondzie Dmowskiego; idealne dla nisz architektonicznych z dala od głównego ruchu turystycznego.","sources":[{"tier":"A","url":"https://pawilonzodiak.pl/en/visit/","for":"adres, godziny otwarcia, bezpłatny wstęp"},{"tier":"B","url" acu)","lines":["BUS"],"hr_week":null,"hr_weekend":null,"img":null,"wiki":null,"ds":"Autorska kuźnia Konrada Barona, jednego z najbardziej cenionych polskich twórców kutych noży dla czołowych szefów kuchni (jest bratem Aleksandra Barona z restauracji Solec 44). Mieści się w dawnych budynkach gospodarczych należących niegdyś do Pałacu w Wilanowie - industrialna, surowa przestrzeń z historią. Baron porzucił studia archeologiczne dla kowalstwa; jego ostrza to niemal małe dzieła sztuki, robione na zamówienie, prowadzi też wielodniowe kursy kucia noży (geometria, hartowanie, rodzaje stali). Miejsce skrajnie niszowe, dostępne po umówieniu. Dojazd: Wilanów, autobusy w rejonie pałacu; samochodem ok. 20-30 min od centrum.","sources":[{"tier":"A","url":"https://sukces.rp.pl/made-in-poland/art18488901-polski-hand-made-oni-robia-noze-dla-czolowych-szefow-kuchni","for":"Konrad Baron kuje noże dla czołowych szefów kuchni w Polsce"},{"tier":"B","url":"https://mrvintage.pl/2021/10/kuznia-barona-rzemieslnicze-noze-jak-male-dziela-sztuki.html","for":"lokalizacja w dawnych budynkach gospodarczych Pałacu w Wilanowie, charakter rzemiosła"},{"tier":"C","url":"https://aleo.com/int/company/kuznia-barona-konrad-baron-warszawa","for":"rejestr działalności KUŹNIA BARONA - KONRAD BARON, Warszawa (CEIDG)"}],"qc_flags":["MISSING_RT","MISSING_RV","MISSING_HOURS","BY_APPOINTMENT","MISSING"],"confidence":"high","origin":"agent"},{"n":"JapońskieNoże.pl (salon Corazziego)","ct":"knives","la":52.2439,"lo":21.0038,"rt":null,"rt_week":null,"rt_weekend":null,"rv":null,"ad":"Antoniego Corazziego 4","district":"Śródmieście","st":"Ratusz Arsenał (M1)","lines":["M1","TRAM","BUS"],"hr_week":"11:00-19:00","hr_weekend":"sob 11:00-15:00; niedz nieczynne","img":null,"wiki":null,"ds":"Wyspecjalizowany salon stacjonarny z nożami japońskimi w ścisłym centrum, przy placu Bankowym. Na ekspozycji ponad 1500 modeli - od noży dla początkujących po profesjonalne i unikatowe egzemplarze od japońskich mistrzów kowalstwa - a function tileXY(lat,lon,z){
  const n=Math.pow(2,z);
  const x=Math.floor((lon+180)/360*n);
  const r=lat*Math.PI/180;
  const y=Math.floor((1-Math.log(Math.tan(r)+1/Math.cos(r))/Math.PI)/2*n);
  return [x,y];
}
function esriTile(lat,lon,z){z=z||17;const[x,y]=tileXY(lat,lon,z);
  return `https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/${z}/${y}/${x}`;}
function thumb(p){ return p.img ? p.img : esriTile(p.la,p.lo,17); }
/* progresywne realne zdjęcie: satelita natychmiast, realne zdjęcie (Wikipedia) gdy się załaduje.

const photoCache = {};
function wikiApi(t){ return "https://pl.wikipedia.org/w/api.php?action=query&format=json&prop=pageimages&piprop=thumbnail&pithumbsize=640&redirects=1&titles="+encodeURIComponent(t)+"&origin=*"; }
function resolvePhoto(p, apply){
  const sat = thumb(p);
  apply(sat);
  if(p.img) return;
  const key = p.n;
  if(photoCache[key]!==undefined){ if(photoCache[key] && photoCache[key]!==sat) apply(photoCache[key]); return; }
  if(!p.wiki){ photoCache[key]=null; return; }
  if(p._tried) return; p._tried=true;
  try{
    fetch(wikiApi(p.wiki)).then(r=>r.json()).then(d=>{
      let src=null;

      else photoCache[key]=null;
    }).catch(()=>{ photoCache[key]=null; });
  }catch(e){ photoCache[key]=null; }
}

function ratingFor(p){
  if(mode==='weekend') return (p.rt_weekend!=null?p.rt_weekend:p.rt);
  return (p.rt_week!=null?p.rt_week:p.rt);
}
function ratingEstimated(p){
  const w = p.rt_week!=null?p.rt_week:p.rt, e = p.rt_weekend!=null?p.rt_weekend:p.rt;
  return (w!=null && e!=null && w!==e);
}
function fmtRv(n){ return n==null?"":("("+n.toLocaleString('pl-PL')+")"); }
function dotsHtml(lines){
  if(!lines||!lines.length) return '<span style="color:var(--ink3);font-size:11px">brak transitu</span>';
  return '<span class="dots">'+lines.map(c=>{const L0=LD[c]; if(!L0) return '';
    return `<span class="dot" title="${L0.name}" style="background:${L0.color}"></span>`;}).join('')+'</span>';
}
function linesFull(lines){
  if(!lines||!lines.length) return '<span style="color:var(--ink3)">brak transitu publicznego w pobliżu</span>';
  return '<div class="pp-lines">'+lines.map(c=>{const L0=LD[c]; if(!L0) return '';
    return `<span class="pp-ln"><span class="dot" style="background:${L0.color}"></span>${L0.name}</span>`;}).join('')+'</div>';
}

/* ---- SVG teardrop pin ---- */
function pinIcon(ct,hot){
  const c = (MOD[ct]||{}).c || "#888";
  const ico = (MOD[ct]||{}).i || "📍";
  const id = "g"+ct;
  const svg =
    `<svg width="30" height="40" viewBox="0 0 30 40" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="${c}" stop-opacity="1"/>
          <stop offset="1" stop-color="${c}" stop-opacity=".72"/>
        </linearGradient>
        <radialGradient id="${id}i" cx="50%" cy="34%" r="60%">
          <stop offset="0" stop-color="#fff" stop-opacity=".5"/>
          <stop offset="1" stop-color="#fff" stop-opacity="0"/>
        </radialGradient>
      </defs>
      <path d="M15 1C7.27 1 1 7.05 1 14.5 1 24 15 39 15 39s14-15 14-24.5C29 7.05 22.73 1 15 1z"
        fill="url(#${id})" stroke="rgba(255,255,255,.72)" stroke-width="1.4"/>
      <path d="M15 1C7.27 1 1 7.05 1 14.5 1 24 15 39 15 39s14-15 14-24.5C29 7.05 22.73 1 15 1z" fill="url(#${id}i)"/>
      <circle cx="15" cy="14.5" r="8.6" fill="rgba(10,12,18,.34)"/>
    </svg>`;
  return L.divIcon({className:"",html:`<div class="pin${hot?' hot':''}">${svg}<span class="pin-ico">${ico}</span></div>`,
    iconSize:[30,40],iconAnchor:[15,40],popupAnchor:[0,-38]});
}

/* ---- hover card ---- */
const hc = document.getElementById('hovercard');
let hideT=null;
function showHover(p, marker){
  clearTimeout(hideT);
  hc._for = p;
  const h = hoursFor(p), r = ratingFor(p);
  hc.innerHTML =
    `<div class="hc-top" style="background-image:url('${thumb(p)}')">
       <div class="hc-badge">${(MOD[p.ct]||{}).i||"📍"}</div>
       <div>
         <div class="hc-name">${esc(p.n)}</div>
         <div class="hc-cat">${(MOD[p.ct]||{}).l||p.ct}</div>
       </div>
     </div>
     <div class="hc-bot">
       <div class="hc-row"><span class="k">★ ${r!=null?r.toFixed(1):"—"}</span> <span>${r!=null?fmtRv(p.rv):"brak oceny"}</span>${ratingEstimated(p)?' <span style="font-size:9px;color:var(--ink3)">'+(mode==='weekend'?'wkd':'pn-pt')+'</span>':''}</div>
       <div class="hc-row"><span>🕑</span> <span>${h?esc(h):"godziny: brak danych"}</span></div>
       <div class="hc-row"><span>🚉</span> <span>${p.st?esc(p.st):"—"}</span> ${dotsHtml(p.lines)}</div>
       <div class="hc-foot">▼ kliknij pinezkę po szczegóły</div>
     </div>`;
  const pt = map.latLngToContainerPoint(marker.getLatLng());
  const mapRect = document.getElementById('map').getBoundingClientRect();
  let x = pt.x, y = pt.y;
  x = Math.max(140, Math.min(mapRect.width-140, x));
  hc.style.left = (mapRect.left + x) + 'px';
  hc.style.top  = (mapRect.top + y - 44) + 'px';
  hc.classList.add('show');
  resolvePhoto(p, url=>{ if(hc._for===p){ const t=hc.querySelector('.hc-top'); if(t) t.style.backgroundImage='url("'+url+'")'; } });
}
function hideHover(){ hideT=setTimeout(()=>hc.classList.remove('show'),110); }
map.on('move',()=>{ if(hc.classList.contains('show')) hc.classList.remove('show'); });

/* ---- popup ---- */
function popupHtml(p){
  const h=hoursFor(p), r=ratingFor(p);
  const flags=(p.qc_flags||[]).filter(f=>typeof f==='string'&&f.length);
  const src=(p.sources||[]).slice(0,2).map((s,i)=>`<a href="${s.url}" target="_blank" rel="noopener">źródło ${i+1}${s.tier?" ·"+s.tier:""}</a>`).join(" · ");
  return `<div class="pp-top" style="background-image:url('${thumb(p)}')">
      <span class="pp-badge">${(MOD[p.ct]||{}).i||"📍"} ${(MOD[p.ct]||{}).l||p.ct}</span>
      <div class="pp-name">${esc(p.n)}</div>
    </div>
    <div class="pp-body">
      <div class="pp-rt">
        <span class="stars">★ ${r!=null?r.toFixed(1):"—"}</span>
        <span class="rv">${r!=null?fmtRv(p.rv):"brak oceny Google"}</span>
        ${ratingEstimated(p)?'<span class="badge-est">'+(mode==='weekend'?'WEEKEND':'TYDZIEŃ')+'</span>':''}
      </div>
      <div class="pp-line"><span class="ico">🕑</span><span class="v"><b>${mode==='weekend'?'Sob–Nd':'Pn–Pt'}:</b> ${h?esc(h):"brak danych"}</span></div>
      <div class="pp-line"><span class="ico">📍</span><span class="v">${esc(p.ad||"—")}${p.district?", "+esc(p.district):""}</span></div>
      <div class="pp-line"><span class="ico">🚉</span><span class="v">${p.st?esc(p.st):"brak pobliskiej stacji"}</span></div>
      ${linesFull(p.lines)}
      <div class="pp-ds">${esc(p.ds||"")}</div>
      ${flags.length?`<div class="pp-flags">${flags.map(f=>`<span class="flag">${esc(f)}</span>`).join("")}</div>`:""}
      ${src?`<div class="pp-src">📑 ${src}</div>`:""}
      <div class="pp-btns">
        <a class="btn gold" href="${gImages(p)}" target="_blank" rel="noopener">📸 Zdjęcia</a>
        <a class="btn" href="${gTransit(p)}" target="_blank" rel="noopener">🚃 Dojazd</a>
      </div>
    </div>`;
}

/* ---- build markers ---- */
function buildMarkers(){
  P.forEach(p=>{
    const m=L.marker([p.la,p.lo],{icon:pinIcon(p.ct)});
    m.bindPopup(popupHtml(p),{className:'glass',maxWidth:300,closeButton:true,autoPanPadding:[40,40]});
    m.on('mouseover',()=>showHover(p,m));
    m.on('mouseout',hideHover);
    m.on('popupopen',()=>{ hc.classList.remove('show');
      resolvePhoto(p, url=>{ const el=document.querySelector('.leaflet-popup-content .pp-top'); if(el) el.style.backgroundImage='url("'+url+'")'; }); });
    m.on('click',()=>{ m.setPopupContent(popupHtml(p)); });
    m._place=p;
    markers.set(p,m);
  });
}

/* ---- chips ---- */
function buildChips(){
  const box=document.getElementById('chips');
  let html=`<span class="chip allchip on" data-mod="ALL">★ Wszystkie</span>`;
  MOD_ORDER.forEach(k=>{
    const count=P.filter(p=>p.ct===k).length;
    if(!count) return;
    html+=`<span class="chip" data-mod="${k}" style="--cc:${MOD[k].c}">
      <span class="cd" style="background:${MOD[k].c}"></span>${MOD[k].l} <span style="opacity:.5">${count}</span></span>`;
  });
  box.innerHTML=html;
  box.querySelectorAll('.chip').forEach(ch=>ch.addEventListener('click',()=>{
    const mod=ch.dataset.mod;
    active = (mod==='ALL'||active===mod) ? null : mod;
    box.querySelectorAll('.chip').forEach(c=>{
      const on = (active===null && c.dataset.mod==='ALL') || (active!==null && c.dataset.mod===active);
      c.classList.toggle('on',on);
      if(c.classList.contains('on') && c.dataset.mod!=='ALL'){
        c.style.background=MOD[c.dataset.mod].c; c.style.color="#0b0f15";
      } else if(c.dataset.mod!=='ALL'){ c.style.background=""; c.style.color=""; }
    });
    render();
    document.getElementById('list').scrollTop=0;
  }));
}

/* ---- render list + markers per filter ---- */
function visible(){
  const q=query.trim().toLowerCase();
  return P.filter(p=>{
    if(active && p.ct!==active) return false;
    if(q){ const hay=(p.n+" "+(p.st||"")+" "+(p.ds||"")+" "+(p.district||"")+" "+(MOD[p.ct]||{}).l).toLowerCase();
      if(hay.indexOf(q)<0) return false; }
    return true;
  });
}
function render(){
  const vis=visible(), set=new Set(vis);
  markers.forEach((m,p)=>{ if(set.has(p)){ if(!map.hasLayer(m)) m.addTo(map);} else if(map.hasLayer(m)) map.removeLayer(m); });
  // list
  const list=document.getElementById('list');
  if(!vis.length){ list.innerHTML=`<div class="empty">Brak miejsc dla tego filtra.<br>Wyczyść szukajkę lub wybierz „Wszystkie".</div>`; }
  else{
    const byMod={};
    vis.forEach(p=>{(byMod[p.ct]=byMod[p.ct]||[]).push(p);});
    let html="";
    MOD_ORDER.forEach(k=>{ if(!byMod[k]) return;
      byMod[k].forEach(p=>{
        const r=ratingFor(p);
        html+=`<div class="item" data-i="${P.indexOf(p)}">
          <div class="ic" style="border-color:${MOD[p.ct].c}55">${MOD[p.ct].i}</div>
          <div class="meta"><div class="nm">${esc(p.n)}</div>
            <div class="sm">${dotsHtml(p.lines)} ${p.st?esc(p.st):"—"}</div></div>
          <div class="rt">${r!=null?"★ "+r.toFixed(1):""}</div></div>`;
      });
    });
    list.innerHTML=html;
    list.querySelectorAll('.item').forEach(it=>it.addEventListener('click',()=>{
      const p=P[+it.dataset.i], m=markers.get(p);
      if(!map.hasLayer(m)) m.addTo(map);
      map.flyTo([p.la,p.lo],15,{duration:.6});
      m.setPopupContent(popupHtml(p));
      setTimeout(()=>m.openPopup(),350);
      if(window.innerWidth<=760) document.getElementById('sidebar').classList.remove('open');
    }));
  }
  document.getElementById('count').innerHTML=`<b>${vis.length}</b> / ${P.length} miejsc`;
}

/* ---- mode toggle ---- */
document.getElementById('modeToggle').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return;
  mode=b.dataset.mode;
  document.querySelectorAll('#modeToggle button').forEach(x=>x.classList.toggle('on',x===b));
  // refresh open popup + list ratings
  markers.forEach((m,p)=>{ if(m.isPopupOpen&&m.isPopupOpen()) m.setPopupContent(popupHtml(p)); });
  render();
});

/* ---- search ---- */
document.getElementById('q').addEventListener('input',e=>{ query=e.target.value; render(); });

/* ---- mobile sidebar ---- */
document.getElementById('sbToggle').addEventListener('click',()=>{
  document.getElementById('sidebar').classList.toggle('open');
});

/* ---- util ---- */
function esc(s){ return (s==null?"":String(s)).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ---- set default mode button ---- */
document.querySelectorAll('#modeToggle button').forEach(x=>x.classList.toggle('on',x.dataset.mode===mode));

/* ---- init ---- */
buildMarkers();
buildChips();
render();
</script>
</body>
</html>
